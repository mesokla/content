<!doctype html><html><head><meta charset="utf-8"><title>List · 1600×900</title>
<link rel="stylesheet" href="../brand.css">
<style>
.wrap{margin:auto 0;display:grid;grid-template-columns:640px 1fr;gap:88px;align-items:center}
h1{font-size:96px}
ol{list-style:none;counter-reset:i}
li{counter-increment:i;display:grid;grid-template-columns:90px 1fr;align-items:baseline;font-size:34px;font-weight:700;line-height:1.25;padding:20px 0;border-top:3px solid var(--sub)}
li:last-child{border-bottom:3px solid var(--sub)}
li::before{content:"0" counter(i);font-family:var(--display);font-weight:900;font-size:30px;color:var(--sub)}
</style></head><body><div class="canvas"><div class="frame">
 <div class="top"><span class="label" data-f="kicker">tools</span><span class="pill" data-f="tag">save this</span></div>
 <div class="wrap"><h1 class="display" data-f="title">5 tools I use <em>every</em> day</h1>
 <ol data-list="items" data-default="Dune — on-chain dashboards|Kaito — mindshare tracking|Typefully — threads|Notion — content calendar|Claude — drafts &amp; visuals"></ol></div>
 <div class="bottom"><span class="sig">mesokla</span><span class="handle" data-f="handle">@mesokla</span></div>
</div></div><script src="fill.js"></script></body></html>
