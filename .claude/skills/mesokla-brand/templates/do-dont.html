<!doctype html><html><head><meta charset="utf-8"><title>Do / Don’t · 1600×900</title>
<link rel="stylesheet" href="../brand.css">
<style>
.canvas{display:grid;grid-template-columns:1fr 1fr}
.side{padding:80px 80px 72px;display:flex;flex-direction:column}
.sense{background:var(--leaf);color:var(--crimson)}
.mess{background:var(--crimson);color:var(--leaf)}
.side .label{opacity:1}
h2{font-size:150px;margin:14px 0 48px}
ul{list-style:none;display:flex;flex-direction:column;gap:22px}
li{font-size:36px;font-weight:700;line-height:1.25;padding-top:22px;border-top:3px solid currentColor}
.sense li{border-color:var(--violet)}
.foot{margin-top:auto;display:flex;justify-content:space-between}
.sense .label{color:var(--violet)}
</style></head><body><div class="canvas">
<div class="side sense"><span class="label" data-f="la">do this</span><h2 class="display" data-f="a">do</h2>
 <ul data-list="yes" data-default="Post when your audience is awake|One CTA per post|Reply to the first 20 comments"></ul>
 <div class="foot"><span class="sig" style="color:inherit">mesokla</span></div></div>
<div class="side mess"><span class="label" data-f="lb">skip this</span><h2 class="display" data-f="b">don’t</h2>
 <ul data-list="no" data-default="Post at 3am because vibes|GM ×40, no context|Ghost your own replies"></ul>
 <div class="foot" style="justify-content:flex-end"><span class="handle" data-f="handle">@mesokla</span></div></div>
</div><script src="fill.js"></script></body></html>
