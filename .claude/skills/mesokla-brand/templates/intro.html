<!doctype html><html><head><meta charset="utf-8"><title>Intro · animated · 1600×900 · 4s</title>
<link rel="stylesheet" href="../brand.css">
<style>
/* CSS keyframes only, so scripts/video.mjs can scrub frame by frame. 4s total. */
.bar{position:absolute;left:0;right:0;height:34%;animation:4s cubic-bezier(.7,0,.2,1) both}
.bar.v{top:0;background:var(--violet);animation-name:v}
.bar.c{top:33%;background:var(--crimson);animation-name:c}
@keyframes v{0%{transform:translateX(-100%)}15%,55%{transform:none}75%,100%{transform:translateY(-100%)}}
@keyframes c{0%,8%{transform:translateX(100%)}23%,55%{transform:none}75%,100%{transform:translateX(-100%)}}
.word{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.word .display{font-size:230px;letter-spacing:-.025em;animation:w 4s cubic-bezier(.2,.8,.2,1) both}
@keyframes w{0%,62%{opacity:0;transform:translateY(60px)}80%,100%{opacity:1;transform:none}}
.tag{margin-top:28px;color:var(--sub);font-size:28px;letter-spacing:.34em;animation:t 4s both}
@keyframes t{0%,72%{opacity:0}88%,100%{opacity:1}}
</style></head><body><div class="canvas">
<div class="word"><div><div class="display" data-f="name">mesokla</div><div class="tag label" data-f="tag">smtm sense / smtm mess</div></div></div>
<div class="bar v"></div><div class="bar c"></div>
</div><script src="fill.js"></script></body></html>
