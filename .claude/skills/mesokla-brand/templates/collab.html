<!doctype html><html><head><meta charset="utf-8"><title>Collab / announcement · 1600×900</title>
<link rel="stylesheet" href="../brand.css"><link rel="stylesheet" href="post.css">
<style>
.c{margin:auto;text-align:center}
.x{display:flex;align-items:center;justify-content:center;gap:56px;font-family:var(--serif);font-style:italic;font-weight:600;font-size:140px;line-height:1;letter-spacing:-.02em}
.x .times{color:var(--acc);font-style:normal;font-size:90px}
.what{margin-top:40px;font-family:var(--mono);font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub)}
.date{display:inline-block;margin-top:44px}
.orb{position:absolute;width:700px;height:700px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);border:1.5px dashed color-mix(in srgb,var(--fg) 25%,transparent)}
</style></head><body data-theme="violet"><div class="canvas grain">
<img class="layer veins v-c" src="../assets/veins-crimson.svg" alt=""><img class="layer veins v-i" src="../assets/veins-ink.svg" alt=""><div class="layer glow-violet"></div>
<div class="orb"></div>
<div class="frame">
 <div class="top"><span class="kicker" data-f="kicker">✦ announcement</span><span class="chip" style="color:var(--fg)" data-f="tag">new collab</span></div>
 <div class="c"><div class="x"><span>mesokla</span><span class="times">×</span><span data-f="partner">solus</span></div>
 <div class="what" data-f="what">twitter space · web3 growth spells</div>
 <span class="chip date" style="color:var(--acc);background:var(--ink);border-color:var(--ink)" data-f="date">14.11 · 18:00 kyiv</span></div>
 <div class="bottom"><span class="sig">mesokla<span class="star4"></span></span><span class="handle" data-f="handle">@mesokla</span></div>
</div></div><script src="fill.js"></script></body></html>
