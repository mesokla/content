<!doctype html><html><head><meta charset="utf-8"><title>X header · 1500×500</title>
<link rel="stylesheet" href="../brand.css">
<style>
/* 1500×500. Avatar covers bottom-left (~0–330 × 330–500): keep it empty. theme=leaf|violet|crimson|stripes */
.word{position:absolute;right:96px;top:172px;text-align:right}
.word .display{font-size:184px;line-height:.82;letter-spacing:-.025em}
.tag:empty{display:none}
.tag{margin-top:30px;color:var(--sub);font-size:26px;letter-spacing:.32em}
.corner{position:absolute;left:96px;top:72px;color:var(--sub);font-size:20px}
.bmoth{position:absolute;left:56px;top:36px;height:262px}
body.moth .corner{display:none}
body[data-theme=stripes] .bmoth{display:none}
.stripes{display:none;position:absolute;inset:0;grid-template-columns:repeat(3,1fr)}
.stripes div{position:relative;padding:56px 44px;color:var(--leaf);display:flex;flex-direction:column;gap:8px}
.stripes div:nth-child(1){background:var(--leaf);color:var(--crimson)}
.stripes div:nth-child(2){background:var(--violet)}
.stripes div:nth-child(3){background:var(--crimson)}
.stripes .display{font-size:72px}
.stripes .label{font-size:22px;margin-top:10px}
body[data-theme=stripes] .stripes{display:grid}
body[data-theme=stripes] .word,body[data-theme=stripes] .corner{display:none}
</style></head><body><div class="canvas">
<div class="corner label" data-f="corner"></div>
<div class="word"><div class="display" data-f="name">mesokla</div><div class="tag label" data-f="tag"></div></div>
<img class="bmoth" alt="" hidden>
<div class="stripes">
 <div><span class="display">leaf</span><span class="label">#A6B8A0</span></div>
 <div><span class="display">violet</span><span class="label">#8B729C</span></div>
 <div><span class="display">crimson</span><span class="label">#E20942</span></div>
</div>
</div><script src="fill.js"></script><script>
(()=>{const m=new URLSearchParams(location.search).get('moth')||'trail';if(m==='none')return;
const t=document.body.dataset.theme||'leaf';const c={leaf:'crimson',violet:'leaf',crimson:'leaf'}[t];
const i=document.querySelector('.bmoth');i.src='../moth/moth-'+m+'-'+c+'.svg';i.hidden=false;document.body.classList.add('moth');})();</script></body></html>
