<!doctype html><html><head><meta charset="utf-8"><title>Stack · 1080×1350</title>
<link rel="stylesheet" href="../brand.css">
<style>
/* Three colour bands, one idea per band. 4:5 for feed + Instagram. */
.canvas{display:grid;grid-template-rows:1fr 1fr 1fr}
.b{position:relative;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between}
.b1{background:var(--leaf);color:var(--crimson)} .b2{background:var(--violet);color:var(--leaf)} .b3{background:var(--crimson);color:var(--leaf)}
.b .row{display:flex;justify-content:space-between;align-items:center}
.b1 .row{color:var(--violet)}
.b .display{font-size:84px}
</style></head><body><div class="canvas">
<div class="b b1"><div class="row"><span class="label" data-f="kicker">3 rules for X</span><span class="label" data-f="handle">@mesokla</span></div><div class="display" data-f="t1">hook first</div></div>
<div class="b b2"><div class="row"><span class="label">02</span></div><div class="display" data-f="t2">one idea per post</div></div>
<div class="b b3"><div class="row"><span class="label">03</span><span class="sig" style="color:inherit;font-size:26px">mesokla</span></div><div class="display" data-f="t3">reply like a human</div></div>
</div><script src="fill.js"></script></body></html>
