<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dumping Bitcoin Chat</title>
<style>
  :root{
    --bg:#07090f; --card:#0f1420; --card2:#141b2b; --line:#222b3f;
    --text:#eef2fa; --muted:#8a96ad; --hl:#ffd84d; --red:#ff4d5e;
    --btc:#f7931a; --btc2:#ff7a00;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);
    font-family:Inter,"Noto Color Emoji",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
  .emoji{font-family:"Noto Color Emoji"}
  #stage{position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(1200px 900px at 80% -10%,#2a1a05 0%,transparent 60%),
               radial-gradient(1000px 900px at 0% 110%,#0b1c3a 0%,transparent 60%),var(--bg)}
  #shake{position:absolute;inset:0}

  /* Title */
  #title{position:absolute;left:0;right:0;top:0;text-align:center;z-index:20;
    transform-origin:50% 0;font-weight:900;letter-spacing:-3px;line-height:1.02;font-size:128px;padding:0 60px}
  #title .l{display:block}
  #title .dump{color:var(--red);display:inline-block}
  #title .sub{display:block;font-size:84px;letter-spacing:-2px;color:#fff;margin-top:18px;font-weight:800}

  /* Chat card */
  #card{position:absolute;left:36px;right:36px;top:330px;bottom:120px;border-radius:56px;overflow:hidden;
    background:linear-gradient(180deg,var(--card2),var(--card));border:2px solid var(--line);
    box-shadow:0 40px 120px rgba(0,0,0,.6);z-index:5}
  #hdr{position:absolute;left:0;right:0;top:0;height:168px;display:flex;align-items:center;gap:26px;padding:0 40px;
    background:rgba(20,27,43,.96);border-bottom:2px solid var(--line);z-index:3}
  #hdr .back{font-size:64px;color:#5fa8ff;font-weight:300;margin-right:-6px}
  #hdr .gav{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#ff4d5e,#7a0f1c);
    display:flex;align-items:center;justify-content:center;font-size:54px}
  #hdr .nm{font-size:46px;font-weight:800;letter-spacing:-.5px}
  #hdr .st{font-size:31px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;max-width:700px}
  #hdr .st.typing{color:#5fa8ff}
  #body{position:absolute;left:0;right:0;top:168px;bottom:0;overflow:hidden}
  #col{position:absolute;left:0;right:0;top:0;padding:30px 34px 40px}

  .row{display:flex;align-items:flex-end;gap:20px;margin-top:12px;will-change:transform,opacity}
  .row.first{margin-top:30px}
  .row.me{justify-content:flex-end}
  .av{width:84px;height:84px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:46px}
  .av.ghost{visibility:hidden}
  .bub{max-width:760px;padding:22px 32px 24px;border-radius:40px;font-size:46px;line-height:1.22;font-weight:500;
    background:#1d2638;position:relative}
  .row:not(.me) .bub{border-bottom-left-radius:12px}
  .row.me .bub{background:linear-gradient(135deg,var(--btc),var(--btc2));color:#fff;font-weight:700;border-bottom-right-radius:12px}
  .nmTag{display:block;font-size:31px;font-weight:800;margin-bottom:6px;letter-spacing:.2px}
  .hl{color:var(--hl);font-weight:800}
  .row.me .hl{color:#fff;text-decoration:underline;text-decoration-thickness:4px}
  .caps{font-weight:900;letter-spacing:.5px}
  .mono{font-family:"DejaVu Sans Mono",monospace;font-size:42px;color:#39ff88;background:#0a0f0a !important;border:2px solid #143d22}
  .ai{background:linear-gradient(135deg,#2a1740,#401a3b) !important;border:2px solid #c58bff;box-shadow:0 0 50px rgba(197,139,255,.45)}
  .sticker{font-size:190px;line-height:1;padding:0;background:none !important}
  .sys{display:flex;justify-content:center;margin-top:30px}
  .sys span{background:rgba(255,255,255,.08);color:#c8d1e3;font-size:33px;font-weight:600;padding:14px 30px;border-radius:40px}
  .sys.join span{background:rgba(197,139,255,.18);color:#e6ccff}
  .sys.hack span{background:rgba(57,255,136,.12);color:#7dffb0}
  .sys.leave span{background:rgba(255,77,94,.16);color:#ff9aa4}

  .typing{display:flex;gap:12px;padding:30px 34px}
  .typing i{width:18px;height:18px;border-radius:50%;background:#8a96ad;display:block}
  .row.me .typing i{background:#fff}

  /* End card */
  #end{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(5,7,12,.9);backdrop-filter:blur(18px);text-align:center;opacity:0}
  #end .q{font-size:104px;font-weight:900;letter-spacing:-3px;line-height:1.02;padding:0 70px}
  #end .opts{font-size:150px;margin:50px 0 30px}
  #end .or{font-family:Inter;font-weight:900;font-size:90px;color:var(--muted);vertical-align:middle;margin:0 20px}
  #end .r{font-size:56px;font-weight:800;color:var(--hl)}
  #end .src{font-size:30px;color:var(--muted);margin-top:60px}
  #handle{position:absolute;bottom:42px;left:0;right:0;text-align:center;font-size:36px;font-weight:700;color:rgba(255,255,255,.55);z-index:40}
</style>
</head>
<body>
<div id="stage"><div id="shake">
  <div id="title">
    <span class="l">Wall Street is</span>
    <span class="l"><span class="dump">DUMPING</span></span>
    <span class="l">Bitcoin.</span>
    <span class="sub">Over text. <span class="emoji">💀</span></span>
  </div>
  <div id="card">
    <div id="hdr">
      <div class="back">‹</div>
      <div class="gav emoji">📉</div>
      <div><div class="nm">the markets</div><div class="st" id="st"></div></div>
    </div>
    <div id="body"><div id="col"></div></div>
  </div>
</div>
  <div id="end">
    <div class="q">is Bitcoin coming back?</div>
    <div class="opts"><span class="emoji">🔙</span> <span class="or">or</span> <span class="emoji">💀</span></div>
    <div class="r">reply <span class="emoji">👇</span></div>
    <div class="src">sources in the replies</div>
  </div>
  <div id="handle">@mesokla</div>
</div>

<script>
// ---------- cast ----------
const P = {
  fed:   {name:'The Fed',       color:'#7aa2ff', av:'🏛️', avbg:'#1d2d55'},
  bonds: {name:'Bonds',         color:'#4cd97b', av:'💵', avbg:'#123a22'},
  etf:   {name:'ETF Investors', color:'#ffb020', av:'👔', avbg:'#3d2c08'},
  hack:  {name:'Hackers',       color:'#39ff88', av:'👤', avbg:'#000'},
  ai:    {name:'AI IPO',        color:'#c58bff', av:'✨', avbg:'linear-gradient(135deg,#6b2bd1,#d13b9b)'},
  btc:   {name:'Bitcoin',       color:'#f7931a', me:true},
};
const H = s => s.replace(/\[(.+?)\]/g,'<span class="hl">$1</span>');

// ---------- script ----------
// type = typing seconds before, hold = seconds after; sticker/caps/shake flags
const S = [
  {w:'fed',  t:'rates stay at [3.75–4.00%]', type:.8},
  {w:'fed',  t:'and honestly? we might go [higher]'},
  {w:'btc',  t:'mom pls 😭', hold:.2},
  {w:'btc',  sticker:'😭', type:.25, hold:.5},
  {w:'fed',  t:'you pay people [0%]. bonds pay [5%]'},
  {w:'bonds',t:'🛌 [5%] to literally sleep'},
  {w:'bonds',t:'just saying', type:.4, hold:.7},
  {w:'btc',  t:"it's fine. I have my ETF guys 💪", hold:.7},
  {w:'etf',  t:'HOW DO I SELL', caps:1, shake:1, type:.5},
  {w:'etf',  t:'FOUND IT', caps:1, type:.35, hold:.3},
  {w:'etf',  t:"ok we're out. [11 days] in a row 👋", hold:.7},
  {w:'btc',  t:'you said you were long term??'},
  {w:'etf',  t:'WE ARE. LONG TERM IN BONDS', caps:1, hold:.6},
  {w:'bonds',sticker:'😌', type:.3, hold:.6},
  {sys:'hack', t:'👤 Hackers joined via invite link', hold:.6},
  {w:'hack', t:'yo', type:.4, hold:.2},
  {w:'hack', t:'whos wallet is this', type:.6, hold:.4},
  {w:'btc',  t:'NOT NOW', caps:1, shake:1, type:.3, hold:.4},
  {w:'hack', t:'too late lol', type:.6, hold:.5},
  {w:'hack', t:'busy year for us btw 💼', hold:.8},
  {sys:'join', t:'✨ AI IPO joined the chat', type:.0, hold:.5},
  {w:'ai',   t:'hi everyone ✨', type:.5, hold:.3},
  {w:'ai',   t:'[$1.5 trillion] btw', hold:.4},
  {w:'etf',  sticker:'👀', type:.15, hold:.05},
  {w:'bonds',sticker:'👀', type:.15, hold:.05},
  {w:'fed',  sticker:'👀', type:.15, hold:.6},
  {w:'btc',  t:'wow. okay.', type:.7, hold:.8},
  {w:'btc',  t:"you know what's funny", type:1.3},
  {w:'btc',  t:'ETFs were supposed to be the door for big money to come in', hold:1.2},
  {w:'btc',  t:'nobody mentioned doors work both ways 🚪', type:1.1, hold:1.5},
  {sys:'leave', t:'ETF Investors left the chat', type:0, hold:1.1},
  {w:'btc',  t:'…guys?', type:.9, hold:1.6},
];

const INTRO = 2.1, MOVE = .55, POP = .2, ENDFADE = .5, ENDHOLD = 3.2;

// ---------- build DOM ----------
const col = document.getElementById('col');
let prevW = null;
S.forEach((m,i)=>{
  const el = document.createElement('div');
  if (m.sys){
    el.className = 'sys '+m.sys; el.innerHTML = `<span>${m.t}</span>`; prevW = null;
  } else {
    const p = P[m.w], first = m.w !== prevW;
    el.className = 'row'+(p.me?' me':'')+(first?' first':'');
    const cls = 'bub'+(m.caps?' caps':'')+(m.w==='hack'?' mono':'')+(m.w==='ai'?' ai':'')+(m.sticker?' sticker':'');
    const name = (!p.me && first && !m.sticker) ? `<span class="nmTag" style="color:${p.color}">${p.name}</span>` : '';
    const body = m.sticker ? `<span class="emoji">${m.sticker}</span>` : H(m.t);
    const av = p.me ? '' : `<div class="av emoji${first?'':' ghost'}" style="background:${p.avbg}">${p.av}</div>`;
    el.innerHTML = av + `<div class="bub-wrap"><div class="${cls}">${name}${body}</div></div>`;
    // typing bubble (shown in the same slot while "typing")
    const ty = document.createElement('div');
    ty.className = 'row typ'+(p.me?' me':'')+(first?' first':'');
    ty.innerHTML = (p.me?'':`<div class="av emoji${first?'':' ghost'}" style="background:${p.avbg}">${p.av}</div>`)+
      `<div class="bub typing"><i></i><i></i><i></i></div>`;
    ty.style.position='absolute'; ty.style.marginTop='0'; ty.style.left='34px'; ty.style.right='34px';
    m.ty = ty; col.appendChild(ty);
    prevW = m.w;
  }
  m.el = el; col.appendChild(el);
});

// ---------- timeline ----------
let t = INTRO + MOVE*.6;
const sfx = [];
S.forEach(m=>{
  const len = (m.t||'').length;
  const type = m.type ?? Math.min(1.05, Math.max(.45, .32 + len*.02));
  const hold = m.hold ?? Math.min(1.2, Math.max(.35, .25 + len*.022));
  m.tStart = t; m.tShow = t + type; t = m.tShow + hold;
  sfx.push({t:m.tShow, kind: m.sys ? 'sys' : (P[m.w].me ? 'out' : 'in')});
});
const END_T = t + .2;
const TOTAL = END_T + ENDFADE + ENDHOLD;
window.__timeline = {total: TOTAL, sfx, fps: 30};

// ---------- layout measure ----------
function measure(){
  S.forEach(m=>{
    m.top = m.el.offsetTop; m.h = m.el.offsetHeight;
    if (m.ty){ m.ty.style.top = m.top+'px'; m.tyH = m.ty.offsetHeight; }
  });
}
measure();
const bodyH = document.getElementById('body').clientHeight;
const PAD = 40;
// scroll keyframes
const keys = [];
S.forEach(m=>{
  if (m.ty && m.tShow - m.tStart > .05) keys.push({t:m.tStart, v:m.top + m.tyH + PAD});
  keys.push({t:m.tShow, v:m.top + m.h + PAD});
});
keys.forEach(k=>k.v = Math.max(0, k.v - bodyH));
const SCROLL_D = .28;
const easeOut = x => 1 - Math.pow(1-x, 3);
const easeBack = x => { const c1=1.9, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const clamp01 = x => Math.max(0, Math.min(1, x));
// precompute scroll start values
let cur = 0;
keys.forEach((k,i)=>{
  if (i>0){ const p = keys[i-1]; const a = clamp01((k.t-p.t)/SCROLL_D); cur = p.from + (p.v-p.from)*easeOut(a); }
  k.from = cur;
});
function scrollAt(tt){
  let k=null; for (const x of keys){ if (x.t<=tt) k=x; else break; }
  if (!k) return 0;
  const a = clamp01((tt-k.t)/SCROLL_D); return k.from + (k.v-k.from)*easeOut(a);
}

// ---------- render ----------
const titleEl = document.getElementById('title'), cardEl = document.getElementById('card'),
      stEl = document.getElementById('st'), endEl = document.getElementById('end'),
      shakeEl = document.getElementById('shake'), dumpEl = document.querySelector('#title .dump');
const members0 = 5;

function renderAt(tt){
  // title: big centered -> small caption on top
  const a = easeOut(clamp01((tt-INTRO)/MOVE));
  const bigY = 560, smallY = 70, s = 1 - a*0.5;
  titleEl.style.transform = `translateY(${bigY + (smallY-bigY)*a}px) scale(${s})`;
  const dp = clamp01(tt/.35);
  dumpEl.style.transform = `scale(${tt<.35 ? 0.6 + 0.4*easeBack(dp) : 1 + 0.04*Math.sin(tt*9)*(1-a)})`;
  cardEl.style.opacity = 0.18 + 0.82*a;
  cardEl.style.filter = `blur(${(1-a)*14}px)`;
  cardEl.style.transform = `translateY(${(1-a)*120}px)`;

  // messages
  let typingName = null, members = members0, shake = 0;
  S.forEach(m=>{
    const shown = tt >= m.tShow;
    if (m.ty){
      const typing = tt >= m.tStart && !shown && (m.tShow-m.tStart)>.05;
      m.ty.style.opacity = typing ? 1 : 0;
      if (typing){
        typingName = P[m.w].name;
        m.ty.querySelectorAll('i').forEach((d,j)=>{
          const ph = Math.sin((tt*7) - j*0.9); d.style.transform=`translateY(${-ph*7}px)`; d.style.opacity = .45 + .55*(ph*.5+.5);
        });
      }
    }
    if (shown){
      const p = clamp01((tt-m.tShow)/POP);
      const sc = m.sticker ? 0.3 + 0.7*easeBack(p) : 0.82 + 0.18*easeBack(p);
      m.el.style.opacity = Math.min(1, p*2.2);
      m.el.style.transform = `scale(${sc}) translateY(${(1-p)*24}px)`;
      m.el.style.transformOrigin = (m.w && P[m.w].me) ? '100% 100%' : (m.sys ? '50% 50%' : '0% 100%');
      if (m.sys==='hack' || m.sys==='join') members++;
      if (m.sys==='leave') members--;
      const since = tt - m.tShow;
      if (m.shake && since < .45) shake = Math.max(shake, (1 - since/.45));
    } else { m.el.style.opacity = 0; }
  });
  document.getElementById('col').style.transform = `translateY(${-scrollAt(tt)}px)`;
  if (typingName){ stEl.textContent = `${typingName} is typing…`; stEl.className='st typing'; }
  else { stEl.textContent = `${members} members · Bitcoin, The Fed, Bonds, ETF Investors…`; stEl.className='st'; }

  const sx = shake ? Math.sin(tt*90)*18*shake : 0, sy = shake ? Math.cos(tt*77)*10*shake : 0;
  shakeEl.style.transform = `translate(${sx}px,${sy}px)`;

  // end card
  const e = clamp01((tt-END_T)/ENDFADE);
  endEl.style.opacity = e;
  endEl.querySelector('.opts').style.transform = `scale(${0.7 + 0.3*easeBack(clamp01((tt-END_T-.15)/.4))})`;
}
window.renderAt = renderAt;

// live preview when opened normally (?render disables autoplay)
if (!location.search.includes('render')){
  const t0 = performance.now();
  (function loop(){ const tt = ((performance.now()-t0)/1000) % TOTAL; renderAt(tt); requestAnimationFrame(loop); })();
} else { renderAt(0); }
</script>
</body>
</html>
