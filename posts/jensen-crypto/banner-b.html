<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../.claude/skills/mesokla-brand/brand.css">
<style>
.canvas{background:var(--leaf)}
.panel{position:absolute;right:0;top:0;bottom:0;width:600px;background:var(--violet)}
.jensen{position:absolute;right:20px;bottom:0;height:780px}
.txt{position:absolute;left:110px;top:80px}
