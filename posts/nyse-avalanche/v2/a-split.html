<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../.claude/skills/mesokla-brand/brand.css">
<style>
/* A · TWO WORLDS: Wall Street bars bleed in from the left, the Avalanche triangle from the right */
.canvas{background:var(--violet)}
.bars{position:absolute;left:-30px;top:0;bottom:0;display:flex;gap:26px}
.bars i{display:block;width:44px;height:100%;background:var(--leaf)}
.tri{position:absolute;right:-440px;top:90px;width:800px;height:760px;background:var(--crimson);clip-path:polygon(50% 0,100% 100%,0 100%)}
.txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--leaf)}
h1{font-size:146px;line-height:.9;letter-spacing:-.02em}
.sub{margin-top:34px;font-weight:800;font-size:46px}
.badge{margin-top:40px;display:inline-block;background:var(--crimson);border-radius:999px;padding:12px 32px;font-family:var(--display);font-weight:900;font-size:44px}
</style></head><body><div class="canvas">
<div class="bars"><i></i><i></i><i></i><i></i></div><div class="tri"></div>
<div class="txt"><h1 class="display">NYSE picked<br>Avalanche</h1><div class="sub">Stocks onchain: 24/7, instant settlement</div><div class="badge">$AVAX +10%</div></div>
</div></body></html>
