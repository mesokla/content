<!doctype html><html><head><meta charset="utf-8"><title>Kraken × Claude · 1600×900</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden}
body{background:#0B0B10;font-family:Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;position:relative}
.glow{position:absolute;inset:0;
  background:
    radial-gradient(55% 75% at 0% 50%, rgba(113,50,245,.42), rgba(113,50,245,0) 70%),
    radial-gradient(55% 75% at 100% 50%, rgba(217,119,87,.36), rgba(217,119,87,0) 70%);}
.wrap{position:absolute;inset:80px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logos{display:flex;align-items:center;gap:36px}
.tile{background:#fff;border-radius:20px;padding:10px 14px;display:flex;align-items:center}
.tile img{height:124px;width:auto;display:block}
.x{font-weight:300;font-size:44px;color:rgba(255,255,255,.7);line-height:1}
h1{margin-top:86px;font-weight:800;font-size:96px;line-height:1.04;letter-spacing:-.025em}
.chips{margin-top:56px;display:flex;gap:22px}
.chip{border:1.5px solid rgba(255,255,255,.38);border-radius:999px;padding:16px 30px;font-weight:600;font-size:30px;letter-spacing:.005em;color:#fff;background:rgba(255,255,255,.03)}
.foot{position:absolute;left:0;right:0;bottom:0;font-weight:500;font-size:22px;color:#8A8A96;letter-spacing:.01em}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="logos">
    <div class="tile"><img src="kraken.png" alt="Kraken"></div>
    <div class="x">×</div>
    <div class="tile"><img src="anthropic.png" alt="Anthropic"></div>
  </div>
  <h1>Anthropic IPO is live<br>on Kraken</h1>
  <div class="chips">
    <div class="chip">ANTx · $70–78</div>
    <div class="chip">Deadline · Nov 18</div>
    <div class="chip">Listing · Nov 19</div>
  </div>
  <div class="foot">Tokenized asset · price exposure only · allocation not guaranteed</div>
</div>
</body></html>
